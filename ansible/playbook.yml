---
- name: Configure application instance via SSM
  hosts: "{{ target_host }}"
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/app
    venv_dir: /opt/app/.venv
    app_user: ubuntu
    app_port: 8000
    gunicorn_workers: 4

  tasks:
    # -----------------------------------------------------------------------
    # 1. System packages
    # -----------------------------------------------------------------------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Python 3.12, pip, venv, git, and nginx
      ansible.builtin.apt:
        name:
          - python3.12
          - python3.12-venv
          - python3-pip
          - git
          - nginx
          - curl
        state: present

    # -----------------------------------------------------------------------
    # 2. Create app directory and sync source code
    # -----------------------------------------------------------------------
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Copy application source - main.py
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../main.py"
        dest: "{{ app_dir }}/main.py"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"

    - name: Copy application source - app package
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/"
        dest: "{{ app_dir }}/app/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Copy requirements.txt (if present)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../requirements.txt"
      register: req_stat
      delegate_to: localhost
      become: false

    - name: Upload requirements.txt
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../requirements.txt"
        dest: "{{ app_dir }}/requirements.txt"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      when: req_stat.stat.exists

    - name: Create minimal requirements.txt if none present
      ansible.builtin.shell: |
        cat > {{ app_dir }}/requirements.txt << 'EOF'
        fastapi>=0.110.0
        uvicorn[standard]>=0.29.0
        gunicorn>=21.2.0
        EOF
      args:
        creates: "{{ app_dir }}/requirements.txt"

    - name: Copy public/ static directory (if present)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../public"
      register: public_stat
      delegate_to: localhost
      become: false

    - name: Upload public/ directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../public/"
        dest: "{{ app_dir }}/public/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        directory_mode: "0755"
      when: public_stat.stat.exists

    # -----------------------------------------------------------------------
    # 3. Python virtual environment + dependencies
    # -----------------------------------------------------------------------
    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3.12 -m venv {{ venv_dir }}
        creates: "{{ venv_dir }}/bin/activate"

    - name: Upgrade pip inside venv
      ansible.builtin.pip:
        name: pip
        state: latest
        virtualenv: "{{ venv_dir }}"

    - name: Install application dependencies
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        state: present

    # -----------------------------------------------------------------------
    # 4. Systemd service unit
    # -----------------------------------------------------------------------
    - name: Create systemd service unit for the app
      ansible.builtin.copy:
        dest: /etc/systemd/system/app.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=FastAPI application (gunicorn/uvicorn)
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          Environment="PATH={{ venv_dir }}/bin"
          Environment="APP_ENV=production"
          ExecStart={{ venv_dir }}/bin/gunicorn app.main:app \
            -k uvicorn.workers.UvicornWorker \
            -w {{ gunicorn_workers }} \
            -b 0.0.0.0:{{ app_port }} \
            --access-logfile - \
            --error-logfile -
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start app service
      ansible.builtin.systemd:
        name: app.service
        enabled: true
        state: restarted

    # -----------------------------------------------------------------------
    # 5. Nginx reverse proxy (port 80 -> 127.0.0.1:8000)
    # -----------------------------------------------------------------------
    - name: Write nginx site configuration
      ansible.builtin.shell: |
        cat > /etc/nginx/sites-available/app << 'EOF'
        server {
            listen 80 default_server;
            server_name _;

            location / {
                proxy_pass         http://127.0.0.1:8000;
                proxy_set_header   Host $host;
                proxy_set_header   X-Real-IP $remote_addr;
                proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
            }
        }
        EOF

    - name: Enable app nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and restart nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: restarted

    # -----------------------------------------------------------------------
    # 6. Verify app is running locally
    # -----------------------------------------------------------------------
    - name: Wait for app to respond on port 8000
      ansible.builtin.uri:
        url: "http://127.0.0.1:8000/health/"
        method: GET
        status_code: [200, 307]
        timeout: 10
      register: health_result
      retries: 12
      delay: 10
      until: health_result.status in [200, 307]
